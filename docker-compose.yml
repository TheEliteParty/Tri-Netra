version: '3.8'

services:
  trinetra:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./trinetra.db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./datasets:/app/datasets:ro
      - trinetra_data:/app/backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  trinetra_data:
